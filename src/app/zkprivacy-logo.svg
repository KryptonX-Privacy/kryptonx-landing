<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Rectangle with Gradient Fill -->
  <rect width="400" height="400" rx="80" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Border Rectangle with Gradient Stroke -->
  <rect x="10" y="10" width="380" height="380" rx="70" stroke="url(#logoGradient)" stroke-width="20" fill="none"/>
  
  <!-- Letter "Z" with Glow Effect -->
  <path 
    d="M120 120 L280 120 L280 140 L160 260 L280 260 L280 280 L120 280 L120 260 L240 140 L120 140 Z" 
    fill="url(#logoGradient)"
    filter="url(#glow)"
  />
  
  <!-- Animated Dot Indicator -->
  <circle cx="300" cy="100" r="20" fill="#06b6d4" opacity="0.8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
